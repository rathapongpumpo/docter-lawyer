[project]
name = "legal-consult-ai"
version = "0.1.0"
description = "AI service for Nitimitr (RAG, extractive answers, guardrails, SSE streaming)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pythainlp>=5.0",
  "pypdf>=5.0",
  "fonttools>=4.50",
  "python-docx>=1.1",
  "minio>=7.2",
  "cryptography>=43",
  "fpdf2>=2.8",
  "uharfbuzz>=0.42",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/kb/rebuild.py" = ["E501"]
"app/kb/law_import.py" = ["E501"]   # long SQL statements read better unbroken
"app/contracts/review.py" = ["E501"]   # Thai rule texts read better unbroken
"tests/test_contract_review.py" = ["E501"]
"eval/*" = ["ASYNC240"]   # command-line runners: blocking file I/O is fine

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
