# Dev stack for the current shared server / a developer machine.
# Next.js runs on the host (`cd web && pnpm dev`, or pm2 via deploy/pm2/ecosystem.config.cjs); these services bind to 127.0.0.1 only
# on ports that do not clash with other projects on this machine (see CLAUDE.md §5).
name: legal-consult-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_WEB_PASSWORD: ${DB_WEB_PASSWORD}
      DB_AI_PASSWORD: ${DB_AI_PASSWORD}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD}
    command: postgres -c shared_buffers=256MB -c max_connections=100
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redisdata:/data]
    mem_limit: 128m
    restart: unless-stopped
  ai:
    build: { context: ../ai, dockerfile: Dockerfile }
    env_file: ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: lc_ai
      DB_PASSWORD: ${DB_AI_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75 --reload
    ports: ["127.0.0.1:8200:8000"]
    volumes: ["../ai:/srv/ai", "../docs/knowledge-base:/kb:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 768m
    restart: unless-stopped
  # local mail catcher for verification / reset e-mails (dev only): SMTP 127.0.0.1:51025, inbox UI http://127.0.0.1:58025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
    environment: { MP_MAX_MESSAGES: "500" }
    mem_limit: 128m
    restart: unless-stopped
  # S3-compatible object storage for contract files (encrypted by the app before upload). Console: http://127.0.0.1:59001
  # The official minio/minio image cannot be pulled on this server, so the Bitnami legacy build (same server) is used; pick the image for production separately.
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    mem_limit: 512m
    restart: unless-stopped
  # virus scanner for uploads (INSTREAM on 3310); signatures update itself on start
  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:53310:3310"]
    volumes: [clamdata:/var/lib/clamav]
    mem_limit: 2g
    restart: unless-stopped
  # job runner (reindex after publish, later: ingest, exports, reminders) — same image as ai, DB role lc_worker
  worker:
    build: { context: ../ai, dockerfile: Dockerfile }
    env_file: ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: lc_worker
      DB_PASSWORD: ${DB_WORKER_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit        # the .env value is the host's view (127.0.0.1:51025)
      SMTP_PORT: "1025"
    command: python -m worker
    volumes: ["../ai:/srv/ai"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped
  # bge-m3 dense embeddings (docs/03-technical-spec.md §1.1, §4.5) — CPU image; the model (~2.2 GB) downloads on first start.
  embed-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    # max-batch-tokens 2048: larger values exhaust RAM during CPU warm-up (measured peak ≈ 3.9 GB at 2048);
    # longer inputs are truncated to 2048 tokens — every kb chunk is far shorter
    command: --model-id BAAI/bge-m3 --port 8080 --max-client-batch-size 64 --max-batch-tokens 2048
    volumes: [hfcache:/data]
    mem_limit: 5g
    restart: unless-stopped
volumes:
  pgdata: {}
  redisdata: {}
  hfcache: {}
  miniodata: {}
  clamdata: {}
