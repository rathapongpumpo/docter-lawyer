groups:
  - name: legal-consult
    rules:
      - alert: WebDown
        expr: up{job="web"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Web tier is not answering scrapes for 2 minutes" }
      - alert: AiServiceDown
        expr: up{job="ai"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "AI service is not answering scrapes for 2 minutes (chat and search are down)" }
      - alert: ApiServerErrors
        expr: sum(rate(lc_web_api_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(lc_web_api_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of API calls fail with 5xx" }
      - alert: ApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(lc_web_api_duration_seconds_bucket{operation!="chat_stream"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 of non-chat API calls is above 2 s for 10 minutes" }
      - alert: ChatRefusedByRateLimitOrQuota
        expr: sum(increase(lc_web_chat_stopped_total{reason=~"rate_limit|quota"}[15m])) > 200
        for: 0m
        labels: { severity: info }
        annotations: { summary: "Unusually many chat requests refused by limits (abuse or a limit set too low)" }
      - alert: KillSwitchOn
        expr: max(lc_web_kill_switch_active) == 1
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "A kill switch is on: part of the service is deliberately stopped" }
      - alert: WebMemoryHigh
        expr: lc_web_process_resident_memory_bytes > 600 * 1024 * 1024
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Web process above 600 MB (limit 768 MB)" }
      - alert: AiServerErrors
        expr: sum(rate(lc_ai_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "AI service is returning 5xx" }
